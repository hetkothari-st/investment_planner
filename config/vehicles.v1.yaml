# Vehicle taxonomy + declared characteristics — docs/04-ALLOCATION-ENGINE.md.
# These are assumptions with a version number, not measurements. The UI shows
# them and lets the user edit a copy. Never edit in place: copy to
# vehicles.v2.yaml and bump the version.
#
# Conventions:
#   expected_real_return_pct   after inflation (assumptions.v1: 5.0%), before
#                              cost and tax. Deliberately conservative.
#   volatility_annual_pct      annualised stdev of returns.
#   max_historical_dd_pct      worst historical peak-to-trough, honest numbers.
#   liquidity_days             days from sell decision to cash in bank.
#   lock_in_months             hard lock (exit impossible/penal), 0 if none.
#   min_horizon_months         below this the vehicle is gated out, not scored.
#   natural_horizon_months     the holding period the vehicle is built for;
#                              drives fit_horizon = min(h/nat, nat/h).
#   cost_drag_pct              brokerage + slippage + spreads, annualised.
#   expense_ratio_pct          fund TER where applicable.
#   tax                        short_term {rate, threshold_months}: the rate
#                              paid when horizon < threshold; long_term {rate,
#                              exemption_inr} otherwise. Slab-taxed vehicles
#                              carry 0.30 on both sides (single-user system:
#                              owner is in the top bracket; edit if not).
#   effort / knowledge_required  LOW | MEDIUM | HIGH.
version: v1

scoring:
  # suitability = w_horizon*fit_h + w_drawdown*fit_d + w_liquidity*fit_l
  #             + w_return*fit_r + w_effort*fit_e            (docs/04)
  w_horizon: "0.25"
  w_drawdown: "0.20"
  w_liquidity: "0.15"
  w_return: "0.30"
  w_effort: "0.10"
  # fit_r = clamp(net_expected_return_pct / return_norm_pct, 0, 1)
  return_norm_pct: "12.0"

construction:
  max_vehicle_weight: "0.40"   # no single vehicle > 40% of a bucket
  index_floor: "0.50"          # equity bucket: >=50% index if knowledge != HIGH
  gold_ceiling: "0.15"         # commodity.* ceiling, fraction of total
  intl_ceiling: "0.20"         # intl.* ceiling, fraction of total
  sip_round_inr: "500"         # round lines to sensible SIP amounts

